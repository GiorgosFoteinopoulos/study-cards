<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Study Cards</title>
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="js/main.js"></script>
    </head>
    <body>
        <header class="app-header">
            <h1>Study Cards</h1>
            <p class="subtitle">Flashcard decks, saved in a database</p>
        </header>

        <main>
            <section id="deck-panel" class="panel"
                aria-labelledby="decks-heading">
                <h2 id="decks-heading">Your decks</h2>

                <form id="deck-form" class="inline-form" autocomplete="off">
                    <label for="deck-name" class="visually-hidden">Deck
                        name</label>
                    <input id="deck-name" name="name" type="text"
                        placeholder="New deck, e.g. JavaScript" maxlength="100">
                    <button type="submit" id="deck-submit">Create deck</button>
                    <button type="button" id="deck-cancel" class="secondary"
                        hidden>Cancel</button>
                </form>
                <p id="deck-name-error" class="field-error" hidden></p>

                <p id="deck-message" class="message" hidden></p>
                <p id="no-decks" class="empty" hidden>No decks yet. Create your
                    first one above.</p>

                <ul id="deck-list" class="deck-list"></ul>
            </section>

            <section id="card-panel" class="panel"
                aria-labelledby="cards-heading" hidden>
                <div class="panel-header">
                    <h2 id="cards-heading">Cards in <span
                            id="selected-deck-name"></span></h2>
                    <button type="button" id="study-start" hidden>Study this
                        deck</button>
                </div>

                <form id="card-form" class="card-form" autocomplete="off">
                    <label for="card-question">Question</label>
                    <textarea id="card-question" name="question" rows="2"
                        maxlength="500"
                        placeholder="e.g. What does JPA stand for?"></textarea>
                    <p id="card-question-error" class="field-error" hidden></p>

                    <label for="card-answer">Answer</label>
                    <textarea id="card-answer" name="answer" rows="3"
                        maxlength="2000"
                        placeholder="e.g. Jakarta Persistence API"></textarea>
                    <p id="card-answer-error" class="field-error" hidden></p>

                    <div class="form-buttons">
                        <button type="submit" id="card-submit">Add card</button>
                        <button type="button" id="card-cancel" class="secondary"
                            hidden>Cancel</button>
                    </div>
                </form>

                <p id="card-message" class="message" hidden></p>
                <p id="no-cards" class="empty" hidden>This deck has no cards
                    yet.</p>

                <ol id="card-list" class="card-list"></ol>
            </section>

            <section id="study-panel" class="panel"
                aria-labelledby="study-heading" hidden>
                <div class="panel-header">
                    <h2 id="study-heading">Studying <span
                            id="study-deck-name"></span></h2>
                    <button type="button" id="study-stop"
                        class="secondary small">End session</button>
                </div>

                <div id="study-area">
                    <p id="study-progress" class="study-progress"></p>

                    <button type="button" id="study-card" class="flip-card">
                        <span class="flip-card-inner">
                            <span id="study-front"
                                class="flip-card-face flip-card-front">
                                <span class="face-label">Question</span>
                                <span id="study-question"
                                    class="face-text"></span>
                            </span>
                            <span id="study-back"
                                class="flip-card-face flip-card-back">
                                <span class="face-label">Answer</span>
                                <span id="study-answer"
                                    class="face-text"></span>
                            </span>
                        </span>
                    </button>

                    <p class="study-hint">Click the card or press Space to flip.
                        Arrow keys move between cards. Esc ends the session.</p>

                    <div class="study-buttons">
                        <button type="button" id="study-prev"
                            class="secondary">Previous</button>
                        <button type="button" id="study-flip">Flip</button>
                        <button type="button" id="study-next"
                            class="secondary">Next</button>
                    </div>
                </div>

                <div id="study-done" class="study-done" hidden>
                    <p class="study-done-title">Done!</p>
                    <p id="study-done-text"></p>
                    <div class="study-buttons">
                        <button type="button" id="study-again">Study
                            again</button>
                        <button type="button" id="study-back-to-decks"
                            class="secondary">Back to decks</button>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
