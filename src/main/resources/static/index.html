<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Study Cards</title>
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="js/main.js"></script>
    </head>
    <body>
        <header class="app-header">
            <h1>Study Cards</h1>
            <p class="subtitle">Flashcard decks, saved in a database</p>
        </header>
        <main>
            <section class="panel" aria-labelledby="decks-heading">
                <h2 id="decks-heading">Your decks</h2>

                <form id="deck-form" class="inline-form" autocomplete="off">
                    <label for="deck-name" class="visually-hidden">Deck name</label>
                    <input id="deck-name" name="name" type="text"
                            placeholder="New deck, e.g. JavaScript" maxlength="100">
                    <button type="submit">Create deck</button>
                </form>

                <p id="message" class="message" hidden></p>
                <p id="empty" class="empty" hidden>No decks yet. Create your first one above.</p>

                <ul id="deck-list" class="deck-list"></ul>
            </section>
        </main>
    </body>
</html>
